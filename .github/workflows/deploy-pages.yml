name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get latest commit time
        id: last_commit
        run: echo "timestamp=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build site
        working-directory: apps/vite-project
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_LAST_COMMIT_TIME: ${{ steps.last_commit.outputs.timestamp }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPO_NAME/"
          fi

          deno task build --base "$BASE_PATH"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/vite-project/dist
          full_commit_message: |
            deploy: publish site

            Last updated: ${{ steps.last_commit.outputs.timestamp }}
